name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Contract tests
        run: npm run test:contract
      - name: Integration tests
        run: npm run test:integration
      - name: Validate migration
        run: npm run migration:validate
      - name: Migration tests
        run: npm run test:migrations
      - name: Migration failure tests
        run: npm run test:migration-failure
      - name: Build
        run: npm run build

  windows-package:
    needs: quality
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Build
        run: npm run build
      - name: Migration tests
        run: npm run test:migrations
      - name: Migration failure tests
        run: npm run test:migration-failure
      - name: Make Windows x64 installer
        run: npm run make -- --arch=x64
      - name: Packaged smoke test
        run: npm run test:e2e
      - name: Validate packaged layout
        run: npm run test:packaged
      - name: Upload internal Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rumo-windows-x64-internal
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
          if-no-files-found: error
          retention-days: 14
